name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin package
        run: python3 -m unittest -v tests/test_plugin_package.py

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create archive
        if: ${{ steps.release.outputs.release_created }}
        run: |
          tar -czvf cockroachdb-codex-plugin.tar.gz \
            .agents/plugins/marketplace.json \
            plugins/cockroachdb/ \
            README.md \
            CHANGELOG.md \
            LICENSE

      - name: Upload release asset
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} cockroachdb-codex-plugin.tar.gz
